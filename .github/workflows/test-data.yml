# Runs test-data.py against the configured Fabric development workspace.
# Uses the DEV environment and authenticates Fabric CLI through Azure CLI with AZURE_CREDENTIALS.
# Supports calls from other workflows and manual runs.
name: test

on:
  workflow_call:
  workflow_dispatch:

env:
  WORKSPACE_NAME: "RR - PBI Factory {dev}"

jobs:
  test:
    runs-on: ubuntu-latest
    environment: "DEV"

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install ms-fabric-cli python-dotenv

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Fabric CLI Login
        run: fab auth login --azure-cli

      - name: Run Data Tests
        run: >
          python scripts/test-data.py
