name: "Copilot Setup Steps"

# More info: https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:

  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:      
      contents: read

    steps:      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install fabric-cicd azure-identity python-dotenv ms-fabric-cli

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true   

      - name: Fabric CLI Login
        run: fab auth login --azure-cli

      - name: Verify AZ CLI and FAB CLI installation
        run: |
          python --version
          fab --version
          az account show