
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This name is mandatory for Copilot Cloud Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Microsoft Fabric CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ms-fabric-cli

      - name: Verify Fabric CLI installation
        run: |
          python --version
          fab --version
