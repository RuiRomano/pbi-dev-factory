name: PR validation

on:
  pull_request:
    types: 
      - ready_for_review    
    branches:
      - main
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  bpa:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/bpa.yml

  deploy:
    needs: bpa
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  test:
    needs: deploy
    uses: ./.github/workflows/test.yml
    secrets: inherit
