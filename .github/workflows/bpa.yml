# Runs Best Practice Analyzer (BPA) checks on semantic models and reports under src.
# Caches BPA tools and runs report checks even if semantic model checks fail.
# Supports calls from other workflows and manual runs.
name: bpa
  
on:
  workflow_call:
  workflow_dispatch:
        
jobs:
  
  bpa:   
    runs-on: windows-latest
    
    steps:
        - name: Check out the code
          uses: actions/checkout@v6

        - uses: actions/cache@v5
          id: cache-tools
          with:
            path: |
              ./scripts/bpa/_tools/
            key: ${{ runner.os }}-tools

        - name: BPA Semantic Models
          id: bpa-semantic-models
          run: .\scripts\bpa\bpa.ps1 -src @("./src/*.SemanticModel")
      
        - name: BPA Reports
          if: ${{ success() || steps.bpa-semantic-models.conclusion == 'failure' }}
          id: bpa-reports
          run: .\scripts\bpa\bpa.ps1 -src @("./src/*.Report")