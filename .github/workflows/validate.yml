name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Power BI validation
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install deployment test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test deployment guardrails
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test validation guardrails
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\bpa.tests.ps1 -Integration
      - name: Validate all Power BI source
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\bpa.ps1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpa-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/bpa/
          if-no-files-found: warn
          retention-days: 14
