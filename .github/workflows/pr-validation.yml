# Validates non-draft pull requests targeting main when files under src change.
# Runs BPA first, then deploys and tests, with each job requiring the previous job to succeed.
# Also exposes a manual trigger; the BPA job requires a non-draft pull request event.
name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

    branches:
      - main
    paths:
      - "src/**"
      
  workflow_dispatch:

jobs:
  bpa:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/bpa.yml

  deploy:
    needs: bpa
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  test:
    needs: deploy
    uses: ./.github/workflows/test.yml
    secrets: inherit
